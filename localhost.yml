- hosts: localhost
  vars:
    # sudo prompts for a fingerprint first, so the password prompt ansible
    # matches on only appears after pam_fprintd gives up (default wait: 10s)
    ansible_local_become_success_timeout: 60
  tasks:
    - name: skip fingerprint reader for sudo
      lineinfile:
        path: /etc/pam.d/sudo
        line: "auth       sufficient   pam_unix.so"
        insertbefore: '^auth\s+include\s+system-auth'
        firstmatch: yes
      become: yes
    - name: install zoom updater
      copy:
        src: zoom-update.service
        dest: /etc/systemd/system
      become: yes
    - name: install zoom update timer
      copy:
        src: zoom-update.timer
        dest: /etc/systemd/system
      become: yes
    - name: enable zoom update timer
      systemd:
        name: zoom-update.timer
        state: started
        enabled: yes
    - name: remove browser switcher policies
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/opt/chrome/policies/managed/browser-switcher.json
        - /etc/chromium/policies/managed/browser-switcher.json
      become: yes
    - name: install native messaging host to open links in firefox
      copy:
        src: open-in-firefox
        dest: /usr/local/libexec/open-in-firefox
        mode: "0755"
      become: yes
    - name: create native messaging host directories
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/opt/chrome/native-messaging-hosts
        - /etc/chromium/native-messaging-hosts
      become: yes
    # chromium only for developing the extension with --load-extension
    - name: register native messaging host with chrome and chromium
      copy:
        src: open-in-firefox.json
        dest: "{{ item }}/open_in_firefox.json"
        mode: "0644"
      loop:
        - /etc/opt/chrome/native-messaging-hosts
        - /etc/chromium/native-messaging-hosts
      become: yes
    - name: create open in firefox extension directory
      file:
        path: /usr/local/share/chrome-open-in-firefox
        state: directory
        mode: "0755"
      become: yes
    - name: install open in firefox extension
      copy:
        src: "{{ item.src }}"
        dest: "/usr/local/share/chrome-open-in-firefox/{{ item.dest }}"
        mode: "0644"
      loop:
        - {src: chrome-open-in-firefox.crx, dest: open-in-firefox.crx}
        - {src: chrome-open-in-firefox-updates.xml, dest: updates.xml}
      become: yes
    - name: create chrome policy directory
      file:
        path: /etc/opt/chrome/policies/managed
        state: directory
        mode: "0755"
      become: yes
    - name: open links from chrome web apps in firefox
      copy:
        src: chrome-open-in-firefox-policy.json
        dest: /etc/opt/chrome/policies/managed/open-in-firefox.json
        mode: "0644"
      become: yes
    - name: install nextcloud talk update script
      copy:
        src: talk-update
        dest: /usr/local/sbin/talk-update
        mode: "0755"
      become: yes
    - name: install nextcloud talk updater
      copy:
        src: talk-update.service
        dest: /etc/systemd/system
      become: yes
    - name: install nextcloud talk update timer
      copy:
        src: talk-update.timer
        dest: /etc/systemd/system
      become: yes
    - name: enable nextcloud talk update timer
      systemd:
        name: talk-update.timer
        state: started
        enabled: yes
        daemon_reload: yes
      become: yes
