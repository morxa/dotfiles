# Some speakers (e.g. Anker SoundCore 2) advertise both A2DP Sink and A2DP
# Source and connect to our A2DP Sink endpoint as well. WirePlumber then picks
# the "High Fidelity Duplex (A2DP Source/Sink)" profile, which streams without
# errors but the speaker stays silent. Don't act as an A2DP sink so that the
# plain A2DP (source) profile is used. Default roles minus a2dp_sink.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_source bap_sink bap_source hfp_hf hfp_ag ]
}
