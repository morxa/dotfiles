- hosts: localhost
  vars:
    # sudo prompts for a fingerprint first, so the password prompt ansible
    # matches on only appears after pam_fprintd gives up (default wait: 10s)
    ansible_local_become_success_timeout: 60
  tasks:
    - name: install zoom updater
      copy:
        src: zoom-update.service
        dest: /etc/systemd/system
      become: yes
    - name: install zoom update timer
      copy:
        src: zoom-update.timer
        dest: /etc/systemd/system
      become: yes
    - name: enable zoom update timer
      systemd:
        name: zoom-update.timer
        state: started
        enabled: yes
    - name: create chrome policy directory
      file:
        path: /etc/opt/chrome/policies/managed
        state: directory
        mode: "0755"
      become: yes
    - name: open links in firefox instead of chrome
      copy:
        src: chrome-browser-switcher.json
        dest: /etc/opt/chrome/policies/managed/browser-switcher.json
        mode: "0644"
      become: yes
